name: CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Unit Tests
        id: coverage
        run: npm run test:coverage

      - name: Run E2E Tests
        run: npm run test:e2e

      # Upload the coverage report as an artifact.
      # if: always() so this still runs when "Run Unit Tests" fails the coverage
      # threshold; skipped when that step never ran (e.g. an earlier Lint
      # failure), since there is no report to upload then.
      - name: Upload Coverage Report
        if: always() && steps.coverage.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      # Coverage summary directly in the PR/Action log.
      # if: always() so the PR comment still appears even when the coverage gate
      # is red; skipped when "Run Unit Tests" never ran (e.g. an earlier Lint failure).
      - name: Coverage Summary
        if: always() && steps.coverage.outcome != 'skipped'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CICD_CLIENT_ID }}
          private-key: ${{ secrets.CICD_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  docker:
    needs: [test, release]
    runs-on: ubuntu-latest
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-tags: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ needs.release.outputs.new_release_published == 'true' }}
            type=raw,value=${{ needs.release.outputs.new_release_version }},enable=${{ needs.release.outputs.new_release_published == 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
