# Local build/run of the app container, mirroring gritshot's compose.yaml.
# The production setup (Traefik labels + named external volume, per
# CLAUDE.md > Compose-Konventionen) is not part of this file.
services:
  app:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    image: dahamm-app:local
    container_name: dahamm-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: packages/app/.env
    volumes:
      - dahamm-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  dahamm-data:
