# Local build/run of the app container, mirroring gritshot's compose.yaml.
# The production setup (Traefik labels + named external volume, per
# CLAUDE.md > Compose-Konventionen) is not part of this file.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: glenidunno:local
    container_name: glenidunno
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      - glenidunno-data:/data
      # Presentation uploads, stored 1:1 (MEDIA_PATH, see Dockerfile).
      - glenidunno-media:/media
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  glenidunno-data:
  glenidunno-media:
